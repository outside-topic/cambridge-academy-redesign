<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Cambridge Association of Professionals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">
        <div class="container-fluid g-0">
            <div class="row g-0 min-vh-100">

                <!-- ========== LEFT PANEL ========== -->
                <div class="col-lg-12">
                    <div class="login-hero">
                        <div class="login-hero-dots" aria-hidden="true"></div>
                        <div class="login-hero-orb login-hero-orb--1" aria-hidden="true"></div>
                        <div class="login-hero-orb login-hero-orb--2" aria-hidden="true"></div>
                        <div class="login-hero-orb login-hero-orb--3" aria-hidden="true"></div>
                        <div class="login-hero-glow" aria-hidden="true"></div>
                        <div class="login-hero-accent-line" aria-hidden="true"></div>

                        <div class="login-hero-inner">
                            <div class="row d-flex justify-content-center">
                                <div class="col-lg-5">
                                    <div class="login-card" data-login-anim="card-enter">
                                        <div class="login-card-accent" aria-hidden="true"></div>

                                        <div class="login-card-header">
                                            <h2 class="login-card-title">Login</h2>
                                            <p class="login-card-subtitle">Enter your credentials to access your account
                                            </p>
                                        </div>

                                        <form class="login-form" id="loginForm" novalidate>
                                            <!-- Email -->
                                            <div class="login-field" id="emailField">
                                                <div class="login-input-wrap">
                                                    <span class="login-input-icon" aria-hidden="true">
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                                            stroke="currentColor" stroke-width="1.8"
                                                            stroke-linecap="round" stroke-linejoin="round">
                                                            <path
                                                                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                                            <polyline points="22,6 12,13 2,6" />
                                                        </svg>
                                                    </span>
                                                    <input type="email" class="login-input" id="email" name="email"
                                                        placeholder=" " autocomplete="email" required
                                                        aria-describedby="emailError">
                                                    <label for="email" class="login-float-label">Email Address</label>
                                                    <span class="login-input-border" aria-hidden="true"></span>
                                                </div>
                                                <span class="login-error" id="emailError" role="alert"></span>
                                            </div>

                                            <!-- Password -->
                                            <div class="login-field" id="passwordField">
                                                <div class="login-input-wrap">
                                                    <span class="login-input-icon" aria-hidden="true">
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                                            stroke="currentColor" stroke-width="1.8"
                                                            stroke-linecap="round" stroke-linejoin="round">
                                                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                                        </svg>
                                                    </span>
                                                    <input type="password" class="login-input" id="password"
                                                        name="password" placeholder=" " autocomplete="current-password"
                                                        required aria-describedby="passwordError">
                                                    <label for="password" class="login-float-label">Password</label>
                                                    <span class="login-input-border" aria-hidden="true"></span>
                                                    <button type="button" class="login-password-toggle"
                                                        id="passwordToggle" aria-label="Show password" tabindex="0">
                                                        <svg class="login-eye-open" width="20" height="20"
                                                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                            stroke-width="1.8" stroke-linecap="round"
                                                            stroke-linejoin="round">
                                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                                            <circle cx="12" cy="12" r="3" />
                                                        </svg>
                                                        <svg class="login-eye-closed" width="20" height="20"
                                                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                            stroke-width="1.8" stroke-linecap="round"
                                                            stroke-linejoin="round">
                                                            <path
                                                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                                            <line x1="1" y1="1" x2="23" y2="23" />
                                                        </svg>
                                                    </button>
                                                </div>
                                                <span class="login-error" id="passwordError" role="alert"></span>
                                            </div>

                                            <!-- Remember & Forgot -->
                                            <div class="login-meta">
                                                <label class="login-remember">
                                                    <input type="checkbox" class="login-checkbox" id="remember"
                                                        name="remember">
                                                    <span class="login-checkbox-box" aria-hidden="true">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                                                            stroke="currentColor" stroke-width="3"
                                                            stroke-linecap="round" stroke-linejoin="round">
                                                            <polyline points="20 6 9 17 4 12" />
                                                        </svg>
                                                    </span>
                                                    <span class="login-remember-text">Remember Me</span>
                                                </label>
                                                <a href="#" class="login-forgot">Forgot Password?</a>
                                            </div>

                                            <!-- Submit -->
                                            <button type="submit" class="btn btn-accent btn-lg login-submit d-flex justify-content-center">
                                                <span class="login-submit-text ">Login</span>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/custom.js"></script>
    
</body>

</html>
